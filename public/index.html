<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketTren | Train Booking</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="/js/main.js"></script>
</head>

<body>
    <header>
        <h1>TicketTren</h1>
        <p>Book your next train journey.</p>
        <div class="language-selector">
            <label for="language-select">Language / Idioma</label>
            <select id="language-select">
                <option value="en-US">English</option>
                <option value="es-MX">Español</option>
            </select>
        </div>

    </header>

    <main>
        <section>
            <h2>Find a Journey</h2>
            <form id="search-form" style="margin-bottom: 1em;">
                <div class="city-selector">
                    <label for="origin">Origin city</label>
                    <select id="origin" name="origin" required>
                        <option value="">Select an origin city</option>
                    </select>
                </div>
                <div class="city-selector">
                    <label for="destination">Destination city</label>
                    <select id="destination" name="destination" required>
                        <option value="">Select a destination city</option>
                    </select>
                </div>

                <div class="trip-options" style="margin-top: 0.5em;">
                    <label for="one-way">One-way trip</label>
                    <input type="checkbox" id="one-way" checked>
                </div>

                <fieldset class="date-field" id="departure-date-selector">
                    <legend>Departure date</legend>
                    <div class="date-selectors" id="departure-date">
                        <select id="departure-month" aria-label="Departure month">
                            <option value="">MM</option>
                        </select>
                        <span>/</span>
                        <select id="departure-day" aria-label="Departure day">
                            <option value="">DD</option>
                        </select>
                        <span>/</span>
                        <select id="departure-year" aria-label="Departure year">
                            <option value="">YYYY</option>
                        </select>
                    </div>
                </fieldset>

                <fieldset class="date-field" id="return-date-selector" hidden>
                    <legend>Return date</legend>
                    <div class="date-selectors" id="return-date">
                        <select id="return-month" aria-label="Return month">
                            <option value="">MM</option>
                        </select>
                        <span>/</span>
                        <select id="return-day" aria-label="Return day">
                            <option value="">DD</option>
                        </select>
                        <span>/</span>
                        <select id="return-year" aria-label="Return year">
                            <option value="">YYYY</option>
                        </select>
                    </div>
                </fieldset>
            </form>
            <button type="submit" form="search-form">Search journeys</button>
        </section>

        <section>
            <h2>Available Journeys</h2>
            <p id="search-status">Enter your search criteria to find journeys.</p>
            <div id="journey-results"></div>
        </section>

        <section class="cancel-ticket-section">
            <h2>Review ticket</h2>
            <p>Enter your ticket ID and booking reference to review your reservation.</p>

            <form id="cancel-ticket-form">
                <label for="cancel-ticket-id">Ticket ID</label>
                <input id="cancel-ticket-id" name="ticketId" type="number" min="1" step="1" required>

                <label for="cancel-booking-reference">Booking reference</label>
                <input id="cancel-booking-reference" name="bookingReference" type="text" maxlength="11" required>

                <button type="submit">Review ticket</button>
            </form>

            <div id="ticket-review-details" hidden></div>
            <button id="cancel-ticket-button" type="button" hidden>Cancel ticket</button>
            <p id="cancel-ticket-message" role="status"></p>
        </section>

    </main>
</body>

</html>
